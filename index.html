  <!-- The intro and scroll-reveal styles only apply when scripts run, so content stays visible without JS.
       The intro plays once per browser session. "world" is set before first paint when the device
       should get the scroll-driven 3D world (motion allowed, WebGL available, not low-power/data-saver),
       so the chapter layout never shifts after load. -->
  <script>
    (function (root) {
      root.classList.add("js");
      try {
        if (sessionStorage.getItem("intro-seen")) root.classList.add("intro-seen");
        sessionStorage.setItem("intro-seen", "1");
      } catch (e) {}
      // Skip works before the app has hydrated: the first click, tap, key or
      // wheel fades the intro out (or hides it if its own fade has begun).
      var skip = function () {
        var o = document.getElementById("opening");
        if (!o) return;
        if (performance.now() > 1500) o.style.display = "none";
        else o.classList.add("intro-leave");
      };
      ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (t) {
        addEventListener(t, skip, { capture: true, passive: true, once: true });
      });
      try {
        var nav = navigator, conn = nav.connection || {};
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        if (conn.saveData || (nav.deviceMemory || 8) <= 2 || (nav.hardwareConcurrency || 8) <= 2) return;
        var c = document.createElement("canvas");
        if (c.getContext("webgl2") || c.getContext("webgl")) root.classList.add("world");
      } catch (e) {}
    })(document.documentElement);
  </script>
